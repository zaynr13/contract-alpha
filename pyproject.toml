[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlb-contract-year-trap"
version = "0.1.0"
description = "Do teams pay for sustainable talent—or the perfect contract year?"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "requests>=2.31,<3",
  "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
