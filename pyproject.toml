[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-alpha"
version = "0.1.0"
description = "Reproducible research on MLB free-agent pricing and realized on-field value"
requires-python = ">=3.9"
dependencies = [
  "pandas>=2.1,<3",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
